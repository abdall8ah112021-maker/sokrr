<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Rounded Square with Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" />
  <!-- Inner Background -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#innerGrad)" />
  
  <!-- Central Sparkle / Smart Loyalty Symbol -->
  <g filter="url(#glow)">
    <path d="M32 14 C32 23 23 32 14 32 C23 32 32 41 32 50 C32 41 41 32 50 32 C41 32 32 23 32 14 Z" fill="url(#brandGrad)" />
    <path d="M47 15 C47 18 44 21 41 21 C44 21 47 24 47 27 C47 24 50 21 53 21 C50 21 47 18 47 15 Z" fill="#67e8f9" />
    <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  </g>
</svg>
